[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# e2e tests drive a real QApplication + MeasurementWorker through the
# in-package simulator. They pass cleanly in their own pytest invocation
# but interact poorly with module-scoped Qt state from earlier test files,
# so we keep them out of the default run and exercise them in a dedicated
# CI step (.github/workflows/tests.yml).
addopts = -v --tb=short --ignore=tests/test_e2e_simulator.py
markers =
    e2e: end-to-end integration tests that drive the GUI + worker against the simulator (run in own pytest invocation)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
