name: docs

# Builds the mkdocs-material site from docs/ and deploys it to GitHub
# Pages. Triggered on every push to main that touches the docs sources
# or the mkdocs config — keeps the live site current without burning
# CI minutes on unrelated commits.

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  workflow_dispatch:

# Required by actions/deploy-pages to push to the github-pages
# environment.
permissions:
  contents: read
  pages: write
  id-token: write

# Avoid concurrent deploys clobbering each other when multiple pushes
# land back-to-back.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and publish to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # mkdocs git-revision plugins want full history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install mkdocs-material
        run: pip install mkdocs-material

      - name: Build site
        run: mkdocs build --strict

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload built site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
