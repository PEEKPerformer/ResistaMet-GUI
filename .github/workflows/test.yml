name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: pytest (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxcb-cursor0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest (unit + integration)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -v

      - name: Run pytest (end-to-end against simulator)
        env:
          QT_QPA_PLATFORM: offscreen
        # E2E suite drives the GUI + worker through the in-package fake
        # Keithley. It runs in its own pytest invocation because it leaves
        # process-wide state (pyvisa.ResourceManager monkey-patch, QThreads)
        # that interacts poorly with module-scoped fixtures from earlier
        # test files when both run in the same invocation.
        run: pytest tests/test_e2e_simulator.py -v

      - name: Smoke-test the screenshot generator
        # Catches "generator broke" early — e.g. if format_readout_html
        # or accuracy.py changes shape, the generator's import or call
        # surface needs to keep up. We don't byte-diff vs the committed
        # PNGs because macOS-vs-Linux font rendering differs slightly;
        # the canonical committed screenshots are auto-regenerated by
        # build.yml on tag push (Linux).
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/generate_screenshots.py --out /tmp/screenshots-smoke
