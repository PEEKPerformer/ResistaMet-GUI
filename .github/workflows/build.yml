name: build

# Windows-only by design. NI-VISA — the driver layer ResistaMet uses to
# talk to Keithley 2400/2450 sourcemeters — is not available on macOS.
# A Prologix-style GPIB-to-USB adapter with pyvisa-py might work on a
# Mac in theory, but has not been verified with ResistaMet, so we don't
# ship a Mac build.

on:
  # Build on every push to a tag so each release auto-attaches a .exe.
  push:
    tags:
      - 'v*'
  # Manual trigger for testing without cutting a release.
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    # softprops/action-gh-release needs contents:write to update the
    # release the tag push created. Without this the build succeeds but
    # the .exe never lands on the release page — observed once on v1.9.0
    # ("Resource not accessible by integration"), patched here.
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build ResistaMet.exe
        run: pyinstaller resistamet-gui.spec --noconfirm --clean

      - name: Smoke test the .exe (--version exits cleanly)
        shell: pwsh
        run: |
          # --version is a fast-path that doesn't import Qt; if PyInstaller
          # missed core deps, this fails with ImportError before the GUI
          # even tries to start.
          $proc = Start-Process -FilePath "dist\ResistaMet.exe" -ArgumentList "--version" -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) {
            Write-Error "ResistaMet.exe --version exited with code $($proc.ExitCode)"
            exit 1
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResistaMet-windows-x64
          path: dist/ResistaMet.exe
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ResistaMet.exe

  regen-screenshots:
    name: Regenerate screenshots and commit any drift
    runs-on: ubuntu-latest
    # Only run on actual tag pushes (not workflow_dispatch) so the
    # commit message can reference the tag. The canonical committed
    # screenshots in docs/screenshots/ are Linux-rendered to keep them
    # reproducible — macOS local generation will differ slightly due
    # to font rendering. CI normalizes them on every release.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Check out main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            libxcb-cursor0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Regenerate screenshots
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/generate_screenshots.py

      - name: Commit and push if screenshots changed
        run: |
          if [[ -z "$(git status --porcelain docs/screenshots/)" ]]; then
            echo "Screenshots already match generator output for ${{ github.ref_name }}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/
          git commit -m "docs(screenshots): auto-regen for ${{ github.ref_name }} [skip ci]"
          git push origin main
