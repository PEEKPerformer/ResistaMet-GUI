name: Bug report
description: Something is broken or behaving unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in as much as you can — the details below help reproduce hardware-related issues quickly.

  - type: input
    id: version
    attributes:
      label: ResistaMet GUI version
      description: Found in `Help → About` or `resistamet_gui/constants.py` (`__version__`)
      placeholder: "1.4.1"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 10
        - Windows 11
        - macOS
        - Linux
        - Other (specify in description)
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11.5"
    validations:
      required: true

  - type: input
    id: instrument
    attributes:
      label: Instrument model
      description: Keithley model + firmware if known
      placeholder: "Keithley 2420, firmware C30"

  - type: dropdown
    id: connection
    attributes:
      label: Connection type
      options:
        - GPIB (NI-VISA)
        - GPIB (Prologix)
        - USB
        - Ethernet/LXI
        - Not applicable (software-only bug)

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the 4PP tab
        2. Set source current to 1mA
        3. Click Start
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output or error messages
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for duplicates
          required: true
        - label: I am running the latest released version (or noted my version above)
          required: true
