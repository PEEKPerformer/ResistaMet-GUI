[package]
name = "resistamet-desktop"
version = "2.0.0-1"
description = "ResistaMet desktop shell"
authors = ["Brenden Ferland"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "resistamet_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
